name: avr-wasi verify

on:
  workflow_dispatch:
  push:
    branches: [wasi-avr-toolchain]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip wasmtime
      - name: verify
        working-directory: verify-bundle
        run: python verify.py
